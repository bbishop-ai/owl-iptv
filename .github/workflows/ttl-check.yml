name: Token TTL check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Mint a fresh token, probe TTL at 0/10/25/35 min
        run: |
          set -e
          pip install -q playwright
          python -m playwright install --with-deps chromium
          uv run python scripts/ttl_probe.py
