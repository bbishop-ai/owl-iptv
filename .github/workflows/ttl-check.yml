name: Token TTL check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch one live tvapp token and report status
        run: |
          set -e
          URL=$(grep -A1 'Grey: NFL Network' <(curl -s https://bbishop-ai.github.io/owl-iptv/playlist.m3u) | grep -o 'https://netanyahu[^ ]*\|https://vishnu[^ ]*' | head -1)
          echo "checking: $URL"
          BUILD_AT=$(curl -s https://bbishop-ai.github.io/owl-iptv/stats.json | python3 -c "import json,sys;print(json.load(sys.stdin)['generated_at'])")
          echo "build generated_at: $BUILD_AT"
          CODE=$(curl -s -o /tmp/body.txt -w '%{http_code}' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36' "$URL")
          echo "HTTP $CODE"
          head -c 120 /tmp/body.txt || true
          test "$CODE" = "200"
