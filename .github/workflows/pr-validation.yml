name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e '.[test]'
          pip install ruff mypy
      - name: Lint with ruff
        run: ruff check src/ tools/ --output-format=github
      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports
      - name: Unit tests
        run: pytest -q

  pipeline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e '.[test]'
      # The pipeline module has no --dry-run flag (fixed 2026-10-14: the smoke
      # call used one and argparse exited 2). Real builds are exercised by the
      # scheduled Sync & Build workflow; this job proves wiring and inventory.
      - name: Import and CLI smoke test
        run: |
          python -c "from iptv_aggregator import pipeline, epg, sources, validator, dedupe; print('core imports ok')"
          python -m iptv_aggregator.pipeline --config config/pipeline.yml --help > /dev/null
          echo 'pipeline CLI wiring ok'
      - name: Sources inventory sanity
        run: |
          python -c "
          import json
          with open('config/sources.json') as f:
              srcs = json.load(f)['sources']
          ids = [s['id'] for s in srcs]
          assert len(ids) == len(set(ids)), 'duplicate source ids'
          kinds = {s.get('kind') for s in srcs}
          assert kinds <= {'playlist', 'epg', 'discovery'}, f'unexpected kinds: {kinds}'
          enabled = [s for s in srcs if s.get('enabled', True)]
          print(f'sources inventory ok: {len(srcs)} entries, {len(enabled)} enabled')
          "
      - name: Verify pipeline config is valid
        run: |
          python -c "
          import yaml
          with open('config/pipeline.yml') as f:
              cfg = yaml.safe_load(f)
          required = ['sources_file', 'filter', 'fetch', 'validation', 'dedupe', 'epg', 'publish']
          for key in required:
              assert key in cfg, f'Missing required config: {key}'
          print('Pipeline config validation passed')
          "