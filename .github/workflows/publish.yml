name: Build and publish IPTV

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      refresh_audit:
        description: Re-audit current upstream repositories
        required: false
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media probes and project
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -e '.[test]'
      - uses: actions/cache@v4
        with:
          path: build
          key: iptv-cache-${{ runner.os }}-${{ hashFiles('config/sources.json', 'config/pipeline.yml') }}
          restore-keys: iptv-cache-${{ runner.os }}-
      - name: Verify source inventory is reproducible
        if: ${{ inputs.refresh_audit == true }}
        run: python -m tools.audit_upstreams --output .
      - name: Unit tests
        run: pytest -q
      - name: Build fresh candidate and run sanity checks
        run: python -m iptv_aggregator.pipeline --config config/pipeline.yml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Atomic Pages deployment
        id: deployment
        uses: actions/deploy-pages@v4

