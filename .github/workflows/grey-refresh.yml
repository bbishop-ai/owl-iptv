name: Grey refresh
# Lightweight re-mint of the tvapp overlay. Runs the grey steps + a full pipeline
# publish on its own cadence so published tvapp tokens are never older than the
# run interval. Skips audit/tests/cache: this lane exists to keep tokens fresh.
on:
  schedule:
    - cron: '0,20,40 * * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + playwright
        run: |
          pip install -e .
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Build grey-market sports overlay
        continue-on-error: true
        env:
          GREY_RELAY: ${{ vars.GREY_RELAY }}
        run: python -m tools.build_grey --out build/generated/grey.m3u
      - name: Refresh thetvapp channel map from live APIs
        continue-on-error: true
        run: python -m tools.refresh_thetvapp
      - name: Resolve thetvapp channels (headless browser)
        continue-on-error: true
        env:
          GREY_RELAY: ${{ vars.GREY_RELAY }}
        run: python -m tools.build_thetvapp --out build/generated/thetvapp.m3u
      - name: Build fresh candidate and run sanity checks
        run: python -m iptv_aggregator.pipeline --config config/pipeline.yml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Atomic Pages deployment
        id: deployment
        uses: actions/deploy-pages@v4