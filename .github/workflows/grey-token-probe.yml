name: Grey token cross-IP probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: Token URL to fetch (from the live playlist)
        required: true
        default: "https://bbishop-ai.github.io/owl-iptv/playlist.m3u"
      delay_minutes:
        description: Minutes to sleep before probing (schedule an offset)
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Sleep for the requested offset
        if: ${{ inputs.delay_minutes != '0' }}
        run: sleep ${{ inputs.delay_minutes }}m
      - name: Fetch playlist and test ALL indianservers URLs
        run: |
          PLAYLIST="${{ inputs.url }}"
          echo "Fetching playlist: $PLAYLIST"
          PLAYLIST_CONTENT=$(curl -s "$PLAYLIST")
          
          # Extract all indianservers master URLs
          mapfile -t URLS < <(echo "$PLAYLIST_CONTENT" | grep -oE 'https://(netanyahu|vishnu|bharat)\.indianservers\.st/secure/[^ ]+' | sort -u)
          
          echo "Found ${#URLS[@]} unique indianservers URLs"
          
          PASS=0
          FAIL=0
          for URL in "${URLS[@]}"; do
            echo "---"
            echo "Testing: ${URL:0:120}"
            CODE=$(curl -s -o /tmp/body.txt -w '%{http_code}' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36' "$URL" --max-time 15)
            echo "HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              head -c 80 /tmp/body.txt || true
              echo " ✓ PASS"
              PASS=$((PASS + 1))
            else
              head -c 120 /tmp/body.txt || true
              echo " ✗ FAIL"
              FAIL=$((FAIL + 1))
            fi
          done
          
          echo "=== SUMMARY ==="
          echo "PASS: $PASS"
          echo "FAIL: $FAIL"
          
          if [ "$PASS" -eq 0 ]; then
            echo "::error::No working tokens found"
            exit 1
          fi