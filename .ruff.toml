# Ruff baseline for owl-iptv (created 2026-10-14 during CI-repair PR).
# Default rule set plus import/bugbear hygiene. BLE001 (blind `except Exception`)
# is intentionally tolerated in src/ and tools/: the fetch/validate/EPG paths
# treat *any* upstream failure as a keep-alive signal (stale-cache fallbacks),
# so broad catches are part of the resilience design, not bugs.
target-version = "py312"

[lint.per-file-ignores]
"src/**" = ["BLE001"]
"tools/**" = ["BLE001"]