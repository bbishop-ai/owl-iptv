[project]
name = "owl-iptv"
version = "1.0.0"
description = "Automated, validated IPTV and XMLTV publishing pipeline"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "PyYAML>=6.0,<7", "rapidfuzz>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
owl-iptv = "iptv_aggregator.pipeline:main"
owl-audit-sources = "tools.audit_upstreams:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

