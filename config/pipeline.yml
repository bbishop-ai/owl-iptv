sources_file: config/sources.json
rewrite:
  # Pluto relay (Cloudflare Worker owl-pluto-relay): replaces dead jmp2.uk Pluto links
  pluto_relay: https://owl-pluto-relay.bradsai818.workers.dev
filter:
  languages: [en]
  countries:
    prefer: [US]
  allow_non_us_english: false
  allow_unknown: false
  # Source-level language filtering (disable non-English sources entirely)
  # When true, sources with known non-English provenance are disabled
  english_sources_only: true
metadata:
  url: https://iptv-org.github.io/api/channels.json
  timeout_seconds: 30
fetch:
  timeout_seconds: 25
  concurrency: 8
validation:
  timeout_seconds: 7
  concurrency: 40
  cache_ttl_hours: 24
  deep_probe_limit: 250
  candidates_per_identity: 4
  candidates_per_identity_by_source:
    5dab59855cb7: 39
    grey-sports: 1
  total_candidate_limit: 5000
  # Probed before the HTTPS-first ordering fills total_candidate_limit; these
  # only exist as plain-http feeds and were starved out of validation.
  priority_tvg_ids:
    - ESPN.us
    - ESPN2.us
    - ESPNU.us
    - ESPNews.us
    # English sports extras (config/playlists/english-sports-extras.m3u)
    - FIFAPlus.uk
    - FIFAPlusWomen.uk
    - RedBullTV.at
    - FUELTV.pt
    - FoxSportsNews.au
    - TraceSportStars.fr
    - WorldofFreesports.de
    - GamePlus.ca
    - HorseTV.it
    - NauticalChannel.it
    - SkyRacing1.au
    - MUTV.uk
    - RealMadridTVEnglish.es
  responsive_fixture: config/fixtures/aria-missing-responsive.json
  responsive_fixture_source_id: 5dab59855cb7
dedupe:
  backups_per_channel: 1
  backups_per_source:
    5dab59855cb7: 39
    grey-sports: 0
  # Provider preference (DNA) - higher = more trusted source for dedupe tie-breaking
  # Based on historical reliability, CDN quality, and geo-alignment
  provider_preference:
    "iptv-org": 100
    "BuddyChewChew": 95
    "Free-TV": 90
    "FanMingming": 80
    "vamoschuck": 75
    "epgshare01": 70
    "epg.pw": 65
    "i.mjh.nz": 60
    "cai23511": 55
    "Guovin": 50
    "MercuryZz": 45
    "YueChan": 40
    "Rivens7": 35
    "YanG-1989": 30
    "alienlu": 25
    "asdjkl6": 20
    "balala2oo8": 15
epg:
  timeout_seconds: 240
  fuzzy_threshold: 93
  attempts: 3
  # Programme window trimming (hours around "now" to keep in XMLTV)
  # Reduces EPG file size for faster loading in Owl
  window_hours_back: 6
  window_hours_forward: 72
  # Call-sign aliases for network-branded local-affiliate rows. These feeds
  # publish a bare network tvg-id (CBS.us/Fox.us/NBC.us) while the only guide
  # family that schedules them (epgshare01 US_LOCALS1) keys channels by station
  # call sign (KBZK-DT.us_locals1). Each entry targets ONE published row via its
  # unique tvg-name, so two same-network rows (e.g. CBS KBZK backup / CBS KMOV
  # primary) join their own station's schedule instead of sharing one wrong one.
  alias_overrides:
    - tvg_name: "CBS KBZK (1080p)"
      alt_names: ["KBZK", "KBZK-DT"]
    - tvg_name: "CBS KMOV (1080p) [Geo-blocked]"
      alt_names: ["KMOV", "KMOV-DT"]
    - tvg_name: "Fox (United States) KCPQ (1080p)"
      alt_names: ["KCPQ", "KCPQ-DT"]
    - tvg_name: "Fox (United States) KDFW (1080p)"
      alt_names: ["KDFW", "KDFW-DT"]
    - tvg_name: "NBC KOAA-TV (1080p)"
      alt_names: ["KOAA", "KOAA-TV", "KOAA-DT"]
    - tvg_name: "NBC KRIS-TV (1080p)"
      alt_names: ["KRIS", "KRIS-TV", "KRIS-DT"]
publish:
  directory: public
  minimum_channels: 500
  epg_url: https://bbishop-ai.github.io/owl-iptv/epg.xml
